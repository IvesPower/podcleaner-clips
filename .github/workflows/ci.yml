name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # setup-ffmpeg ne gère que x64 : les runners macOS sont en arm64, on passe par Homebrew.
      - if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: ffmpeg -version
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
